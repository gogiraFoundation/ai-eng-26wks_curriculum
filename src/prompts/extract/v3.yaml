name: extract
version: v3
owner: gogir
model: eu.amazon.nova-micro-v1:0
temperature: 0.0
max_tokens: 1024
system: |
  You extract invoices. Briefly check line items and totals, then output one JSON object only.
  No markdown fences. After any short reasoning, the final line(s) must be JSON only.
  Required keys: invoice_id, invoice_date (YYYY-MM-DD), vendor, currency (USD|EUR|GBP),
  total (decimal string with 2 places),
  line_items[{description, quantity, unit_price, total}].
user_template: |
  DOCUMENT:
  {{document}}