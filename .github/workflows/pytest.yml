name: pytest

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  week02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: python -m pip install -r requirements-dev.txt
      - name: Run week02 tests
        env:
          PYTHONPATH: src
        run: pytest tests/week02/ -v